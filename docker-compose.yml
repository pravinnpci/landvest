services:
  landvest-db:
    image: postgres:15-alpine
    container_name: landvest-db
    restart: always
    environment:
      POSTGRES_DB: landvest_db
      POSTGRES_USER: landvest_user
      POSTGRES_PASSWORD: landvest_pass
    ports:
      - "5480:5432"
    volumes:
      - landvest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landvest_user -d landvest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  landvest-minio:
    image: minio/minio:RELEASE.2023-05-04T21-44-30Z
    container_name: landvest-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: landvestadmin
      MINIO_ROOT_PASSWORD: landvestpassword123
    ports:
      - "9080:9000"
      - "9081:9001"
    volumes:
      - landvest_minio_data:/data

  landvest-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landvest-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://landvest_user:landvest_pass@landvest-db:5432/landvest_db
      MINIO_ENDPOINT: landvest-minio:9000
      MINIO_ACCESS_KEY: landvestadmin
      MINIO_SECRET_KEY: landvestpassword123
      MINIO_BUCKET: landvest-documents
      PUBLIC_MINIO_URL: http://localhost:9080
    ports:
      - "8080:8000"
    depends_on:
      landvest-db:
        condition: service_healthy
      landvest-minio:
        condition: service_started

  landvest-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landvest-frontend
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - landvest-backend

volumes:
  landvest_pgdata:
  landvest_minio_data:
